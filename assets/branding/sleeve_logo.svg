<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 110 336 280" width="336" height="280">
  <defs>
    <!-- Tactile drop shadows -->
    <filter id="logoBackShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050507" flood-opacity="0.5" />
    </filter>
    <filter id="logoFrontShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#08080A" flood-opacity="0.4" />
    </filter>
    <filter id="logoDiscShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Front sleeve thumb cutout notch mask -->
    <mask id="logoThumbCutout">
      <rect x="0" y="0" width="600" height="600" fill="white" />
      <circle cx="352" cy="256" r="42" fill="black" />
    </mask>

    <!-- Paper gradients -->
    <linearGradient id="logoFrontPaper" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F5" />
      <stop offset="50%" stop-color="#F4EFEA" />
      <stop offset="100%" stop-color="#E8E1D6" />
    </linearGradient>

    <linearGradient id="logoBackPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCD4C8" />
      <stop offset="100%" stop-color="#C0B3A2" />
    </linearGradient>

    <linearGradient id="logoTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB775D" />
      <stop offset="100%" stop-color="#D15C42" />
    </linearGradient>

    <linearGradient id="logoVinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262C" />
      <stop offset="40%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <linearGradient id="logoSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.07" />
    </linearGradient>
  </defs>

  <g transform="translate(-16, 0)">
    <!-- 1. BACK SLEEVE JACKET -->
    <rect x="144" y="124" width="228" height="228" rx="22"
          fill="url(#logoBackPaper)"
          filter="url(#logoBackShadow)" />

    <!-- Inner dark cavity slot -->
    <rect x="154" y="134" width="214" height="214" rx="18"
          fill="#131316" opacity="0.9" />

    <!-- 2. VINYL DISC -->
    <g filter="url(#logoDiscShadow)">
      <circle cx="322" cy="242" r="110" fill="url(#logoVinyl)" />

      <!-- Concentric Grooves -->
      <circle cx="322" cy="242" r="102" fill="none" stroke="#33333C" stroke-width="2.5" opacity="0.75" />
      <circle cx="322" cy="242" r="88"  fill="none" stroke="#383844" stroke-width="2.5" opacity="0.8" />
      <circle cx="322" cy="242" r="74"  fill="none" stroke="#33333C" stroke-width="2.5" opacity="0.75" />
      <circle cx="322" cy="242" r="60"  fill="none" stroke="#383844" stroke-width="2.5" opacity="0.8" />

      <!-- Sheen -->
      <circle cx="322" cy="242" r="110" fill="url(#logoSheen)" />

      <!-- Center Terracotta Label -->
      <circle cx="322" cy="242" r="42" fill="url(#logoTerracotta)" />
      <circle cx="322" cy="242" r="32" fill="none" stroke="#FAF6F0" stroke-width="1.5" opacity="0.35" />
      <circle cx="322" cy="242" r="14" fill="#1A1A1E" />
    </g>

    <!-- 3. FRONT SLEEVE JACKET -->
    <g filter="url(#logoFrontShadow)">
      <rect x="122" y="142" width="230" height="230" rx="22"
            fill="url(#logoFrontPaper)"
            mask="url(#logoThumbCutout)" />

      <rect x="123" y="143" width="228" height="228" rx="21"
            fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"
            mask="url(#logoThumbCutout)" />

      <!-- Graphic Artwork -->
      <rect x="154" y="174" width="38" height="8" rx="4" fill="#E06D53" />
      <rect x="154" y="192" width="22" height="4" rx="2" fill="#8E8477" opacity="0.5" />
      <rect x="182" y="192" width="36" height="4" rx="2" fill="#8E8477" opacity="0.35" />

      <!-- Stylized acoustic soundwave mark -->
      <g transform="translate(154, 252)">
        <rect x="0" y="8"  width="5" height="24" rx="2.5" fill="#8E8477" opacity="0.45" />
        <rect x="9" y="0"  width="5" height="40" rx="2.5" fill="#E06D53" />
        <rect x="18" y="4" width="5" height="32" rx="2.5" fill="#8E8477" opacity="0.65" />
        <rect x="27" y="12" width="5" height="16" rx="2.5" fill="#8E8477" opacity="0.4" />
      </g>

      <!-- Play Chevron -->
      <polygon points="266,324 266,344 282,334" fill="#E06D53" />
    </g>
  </g>
</svg>
